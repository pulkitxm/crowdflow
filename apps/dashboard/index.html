<!doctype html>
<html lang="en" data-theme="control-room">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrowdFlow — Operator Console</title>
  </head>
  <body>
    <!--
      Structure only. Every cell is filled by src/panels/*, because a screen that
      ships with plausible placeholder numbers is a screen that can show plausible
      placeholder numbers during a session.
    -->
    <div id="console" class="console">
      <header id="header" class="strip strip--header"></header>

      <section id="map-panel" class="panel panel--map">
        <div class="panel__head">
          <h2>VENUE — <span id="map-circuit">…</span></h2>
          <div id="map-controls" class="panel__tools"></div>
        </div>
        <div class="map__stage">
          <canvas id="map-canvas"></canvas>
          <div id="map-readout" class="map__readout"></div>
        </div>
        <div id="map-legend" class="map__legend"></div>
      </section>

      <section id="prediction-panel" class="panel panel--prediction">
        <div class="panel__head"><h2>PREDICTION</h2><div id="prediction-model" class="panel__tools"></div></div>
        <div id="prediction-body" class="panel__body"></div>
      </section>

      <section id="intervention-panel" class="panel panel--intervention">
        <div class="panel__head"><h2>INTERVENTION — OPTIONS EVALUATED</h2><div id="intervention-status" class="panel__tools"></div></div>
        <div id="intervention-body" class="panel__body"></div>
      </section>

      <section id="zones-panel" class="panel panel--zones">
        <div class="panel__head"><h2>ZONES</h2><div id="zones-tools" class="panel__tools"></div></div>
        <div id="zones-body" class="panel__body panel__body--table"></div>
      </section>

      <section id="feed-panel" class="panel panel--feed">
        <div class="panel__head"><h2>RACE CONTROL</h2><div id="feed-count" class="panel__tools"></div></div>
        <div id="feed-body" class="panel__body panel__body--feed"></div>
      </section>

      <footer id="metrics" class="strip strip--metrics"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
