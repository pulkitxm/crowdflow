plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.crowdflow'
version = '0.1.0'

android {
  namespace 'com.crowdflow.mesh'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
