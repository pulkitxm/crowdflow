name: Check

on:
  push:
    branches: [bitchat]
  pull_request:

jobs:
  types-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      - run: npx expo config --type public >/dev/null
