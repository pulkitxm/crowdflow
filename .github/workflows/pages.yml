name: Deploy round presentations

on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - "scripts/check-presentation-routes.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Validate presentation routes
        run: bun scripts/check-presentation-routes.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload presentations
        uses: actions/upload-pages-artifact@v5
        with:
          path: presentation
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
