name: Android development build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'patches/**'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36 toolchain
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - run: npx expo prebuild --clean --platform android --no-install
      - run: ./android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crowdflow-mesh-development-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
