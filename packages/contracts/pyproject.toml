[project]
name = "crowdflow-contracts"
version = "0.1.0"
description = "Schemas shared by every CrowdFlow runtime. Single source of truth."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdflow_contracts"]
