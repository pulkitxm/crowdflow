[project]
name = "crowdflow-core"
version = "0.1.0"
description = "The engines. Pure functions over state — no I/O, no sockets, no LLM."
requires-python = ">=3.11"
dependencies = ["crowdflow-contracts", "networkx>=3.2", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdflow_core"]
