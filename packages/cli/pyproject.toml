[project]
name = "crowdflow-cli"
version = "0.1.0"
description = "Thin adapter over crowdflow-core. Permanent evaluation harness, not a scaffold."
requires-python = ">=3.11"
dependencies = ["crowdflow-contracts", "crowdflow-core", "typer>=0.12", "pyyaml>=6"]

[project.scripts]
crowdflow = "crowdflow_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdflow_cli"]
