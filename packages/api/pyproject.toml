[project]
name = "crowdflow-api"
version = "0.1.0"
description = "FastAPI adapter over crowdflow-core. All transport lives here; core stays pure."
requires-python = ">=3.11"
dependencies = [
    "crowdflow-contracts",
    "crowdflow-core",
    "crowdflow-cli",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
crowdflow-api = "crowdflow_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdflow_api"]
